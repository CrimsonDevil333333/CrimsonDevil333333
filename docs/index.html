<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satyaa Goyal – Repositories</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --card-border: rgba(255,255,255,0.06);
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #c5a059;
      --accent-hover: #e5c177;
      --code-bg: #1d1d1f;
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      padding: clamp(1rem, 4vw, 3rem);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .bio {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
    }

    .btn-primary {
      background: rgba(197,160,89,0.15);
      border-color: rgba(197,160,89,0.3);
      color: var(--accent);
    }

    .btn-primary:hover {
      background: rgba(197,160,89,0.25);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px var(--shadow);
      border-color: rgba(197,160,89,0.35);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }

    .card-title a {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-title a:hover {
      color: var(--accent);
    }

    .card-title .material-icons-round {
      font-size: 1.25rem;
      opacity: 0.6;
    }

    .card-desc {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .badge {
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .badge.language-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .readme-btn {
      margin-top: 0.5rem;
      padding: 0.55rem 1rem;
      background: transparent;
      border: 1px solid rgba(197,160,89,0.35);
      color: var(--accent);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .readme-btn:hover {
      background: rgba(197,160,89,0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .readme-btn:active {
      transform: translateY(0);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      padding: 0;
    }

    .dot:hover {
      background: rgba(255,255,255,0.3);
    }

    .dot.active {
      background: var(--accent);
      width: 12px;
      height: 12px;
      margin: -1px 0;
    }

    .page-info {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    .error {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem;
      font-size: 1rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: #1a1a1e;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      font-size: 2rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      padding: 0;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* Markdown inside modal */
    #readme-content {
      font-size: 0.95rem;
      line-height: 1.7;
    }

    #readme-content h1, #readme-content h2, #readme-content h3 {
      color: #fff;
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }

    #readme-content h1:first-child { margin-top: 0; }

    #readme-content p {
      margin-bottom: 1rem;
      color: #d1d1d6;
    }

    #readme-content code {
      background: rgba(255,255,255,0.1);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9em;
      color: #ff9f1c;
    }

    #readme-content pre {
      background: var(--code-bg);
      padding: 1.25rem;
      border-radius: 10px;
      overflow: auto;
      margin: 1.5rem 0;
      border: 1px solid rgba(255,255,255,0.05);
    }

    #readme-content pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #readme-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-muted);
      margin: 1.5rem 0;
      font-style: italic;
    }

    #readme-content ul, #readme-content ol {
      padding-left: 1.75rem;
      margin: 1rem 0;
    }

    #readme-content li {
      margin-bottom: 0.5rem;
      color: #d1d1d6;
    }

    #readme-content a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #readme-content a:hover {
      color: var(--accent-hover);
    }

    #readme-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1rem 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }

    #readme-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }

    #readme-content th, #readme-content td {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem 0.8rem;
      text-align: left;
    }

    #readme-content th {
      background: rgba(255,255,255,0.05);
      font-weight: 600;
    }

    #readme-content hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 2rem 0;
    }

    /* Scrollbar */
    .modal-content::-webkit-scrollbar,
    ::-webkit-scrollbar {
      width: 10px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.03);
      border-radius: 5px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 5px;
    }

    .modal-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Loading state */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(197,160,89,0.3);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .container { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
      .modal-content { padding: 1.5rem; margin: 0.5rem; }
      .card { padding: 1.25rem; }
    }

    /* Focus styles */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Satyaa Goyal</h1>
      <p class="bio">Full‑Stack Developer – Building tools & utilities</p>
    </header>

    <div class="controls">
      <button class="btn" id="refresh-btn" title="Refresh repositories">
        <span class="material-icons-round">refresh</span>
        Refresh
      </button>
      <button class="btn btn-primary" id="sort-btn" title="Sort by latest push">
        <span class="material-icons-round">sort</span>
        Sort: Latest
      </button>
    </div>

    <main>
      <div class="grid" id="repo-grid"></div>
    </main>

    <div class="page-info" id="page-info"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Modal for README -->
  <div id="readme-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="readme-title">
    <div class="modal-content">
      <button id="readme-close" class="close-btn" aria-label="Close modal">
        <span class="material-icons-round">close</span>
      </button>
      <div id="readme-content"></div>
    </div>
  </div>

  <script>
    const githubUser = 'CrimsonDevil333333';
    let repos = [];
    const itemsPerPage = 5;
    let currentPage = 0;

    // Configure marked
    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function languageColor(lang) {
      const colors = {
        'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Python': '#3572A5',
        'Java': '#b07219', 'Go': '#00ADD8', 'Rust': '#dea584', 'C++': '#f34b7d',
        'C': '#555555', 'HTML': '#e34c26', 'CSS': '#563d7c', 'Vue': '#41b883',
        'React': '#61dafb', 'Node.js': '#68a063', 'Shell': '#89e51e', 'Kotlin': '#A97BFF',
        'Swift': '#ffac45', 'PHP': '#4F5D95', 'Ruby': '#701516', 'Dart': '#00B4AB',
        'R': '#198CE7', 'Jupyter Notebook': '#DA5B0B'
      };
      return colors[lang] || '#8e8e93';
    }

    function renderPage(page) {
      const grid = document.getElementById('repo-grid');
      grid.innerHTML = '';
      const start = page * itemsPerPage;
      const end = Math.min(start + itemsPerPage, repos.length);

      for (let i = start; i < end; i++) {
        const r = repos[i];
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <h3 class="card-title">
              <a href="https://github.com/${githubUser}/${encodeURIComponent(r.name)}" target="_blank" rel="noopener noreferrer">
                <span class="material-icons-round">folder</span>
                ${r.name}
              </a>
            </h3>
          </div>
          <p class="card-desc">${r.description || "<em>No description provided</em>"}</p>
          <div class="card-meta">
            ${r.language ? `<span class="badge"><span class="language-dot" style="background:${languageColor(r.language)}"></span>${r.language}</span>` : ''}
            <span title="Stars"><span class="material-icons-round" style="font-size:14px;vertical-align:middle">star</span> ${r.stars}</span>
            <span title="Forks"><span class="material-icons-round" style="font-size:14px;vertical-align:middle">call_split</span> ${r.forks}</span>
            <span title="Last updated"><span class="material-icons-round" style="font-size:14px;vertical-align:middle">update</span> ${formatDate(r.pushed_at)}</span>
          </div>
          <button class="readme-btn" data-repo="${r.name}" aria-label="View README for ${r.name}">
            <span class="material-icons-round">description</span>
            View README
          </button>
        `;
        grid.appendChild(card);
      }

      const totalPages = Math.ceil(repos.length / itemsPerPage);
      document.getElementById('page-info').textContent = totalPages > 0 ? `${page + 1} of ${totalPages}` : '';

      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      for (let d = 0; d < totalPages; d++) {
        const dot = document.createElement('button');
        dot.className = 'dot' + (d === page ? ' active' : '');
        dot.setAttribute('aria-label', `Page ${d + 1}`);
        dot.addEventListener('click', () => {
          currentPage = d;
          renderPage(d);
        });
        pagination.appendChild(dot);
      }
    }

    async function loadRepos() {
      try {
        const res = await fetch(`https://api.github.com/users/${githubUser}/repos?type=owner&sort=pushed&direction=desc&per_page=100`);
        if (!res.ok) throw new Error('Failed to fetch repos');
        const data = await res.json();
        repos = data.map(r => ({
          name: r.name,
          description: r.description,
          language: r.language,
          stars: r.stargazers_count,
          forks: r.forks_count,
          pushed_at: r.pushed_at
        }));
        renderPage(0);
      } catch (err) {
        console.error(err);
        document.getElementById('repo-grid').innerHTML = '<div class="error"><p>Unable to load repositories.</p><p style="font-size:0.9em;margin-top:0.5rem;opacity:0.7">Please try again later or check your connection.</p></div>';
      }
    }

    async function showReadme(repoName) {
      const modal = document.getElementById('readme-modal');
      const content = document.getElementById('readme-content');
      content.innerHTML = '<div style="text-align:center;padding:2rem"><span class="spinner"></span>Loading README…</div>';
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      try {
        const res = await fetch(`https://api.github.com/repos/${githubUser}/${encodeURIComponent(repoName)}/readme`);
        if (!res.ok) {
          if (res.status === 404) {
            content.innerHTML = '<div class="error"><p>No README found for this repository.</p></div>';
          } else {
            throw new Error(`Failed: ${res.status}`);
          }
          return;
        }
        const data = await res.json();
        let readmeText;
        if (data.encoding === 'base64') {
          const decoded = atob(data.content);
          // Decode UTF-8 if needed
          readmeText = decodeURIComponent(escape(decoded));
        } else {
          readmeText = data.content;
        }

        // Parse markdown
        const rawHtml = marked.parse(readmeText);
        // Sanitize
        const cleanHtml = DOMPurify.sanitize(rawHtml, { ADD_TAGS: ['img'], ADD_ATTR: ['src', 'alt', 'title'] });
        content.innerHTML = cleanHtml;

        // Fix GitHub image URLs (convert relative to absolute)
        content.querySelectorAll('img').forEach(img => {
          const src = img.getAttribute('src') || '';
          if (src && !src.startsWith('http') && !src.startsWith('data:')) {
            img.setAttribute('src', `https://raw.githubusercontent.com/${githubUser}/${repoName}/main/${src}`);
          }
          img.loading = 'lazy';
        });

        // Highlight code blocks
        content.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

      } catch (err) {
        console.error(err);
        content.innerHTML = '<div class="error"><p style="color:#ff6b6b">Error loading README.</p><p style="font-size:0.9em;margin-top:0.5rem;opacity:0.7">Please try again later.</p></div>';
      }
    }

    // Modal close handlers
    const modal = document.getElementById('readme-modal');
    const closeBtn = document.getElementById('readme-close');
    closeBtn.onclick = () => { modal.style.display = 'none'; document.body.style.overflow = ''; };
    modal.onclick = (e) => { if (e.target === modal) { modal.style.display = 'none'; document.body.style.overflow = ''; } };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { modal.style.display = 'none'; document.body.style.overflow = ''; } });

    // Event delegation for readme buttons
    document.getElementById('repo-grid').addEventListener('click', (e) => {
      const btn = e.target.closest('.readme-btn');
      if (btn) {
        const repo = btn.dataset.repo;
        if (repo) showReadme(repo);
      }
    });

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', () => {
      loadRepos();
    });

    // Initial load
    loadRepos();
  </script>
</body>
</html>
