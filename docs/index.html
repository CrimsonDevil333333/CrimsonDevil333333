<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satyaa Goyal – Repositories</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    header {
      text-align: center;
      margin-bottom: 3rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: #fff;
    }
    .bio {
      color: #8E8E93;
      font-size: 1rem;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: #1C1C1E;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border-color: rgba(197,160,89,0.3);
    }
    .card-title {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #fff;
    }
    .card-title a {
      color: inherit;
      text-decoration: none;
    }
    .card-title a:hover {
      color: #C5A059;
    }
    .card-desc {
      margin: 0 0 1rem 0;
      font-size: 0.875rem;
      color: #8E8E93;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: #8E8E93;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
    .readme-btn {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid rgba(197,160,89,0.4);
      color: #C5A059;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .readme-btn:hover {
      background: rgba(197,160,89,0.12);
      border-color: rgba(197,160,89,0.8);
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 3rem;
      padding-bottom: 2rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dot.active {
      background: #C5A059;
      width: 10px;
      height: 10px;
      margin: -1px 0;
    }
    .page-info {
      text-align: center;
      color: #8E8E93;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    .error {
      text-align: center;
      color: #8E8E93;
      padding: 2rem;
    }
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .modal-content {
      background: #1C1C1E;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 2rem;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
      margin: 2rem;
    }
    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 1rem;
      font-size: 2rem;
      color: #C5A059;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover {
      color: #fff;
    }

    /* Markdown inside modal */
    #readme-content h1,
    #readme-content h2,
    #readme-content h3 {
      color: #fff;
      margin-top: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }
    #readme-content p {
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 1rem;
    }
    #readme-content code {
      background: rgba(255,255,255,0.1);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9em;
    }
    #readme-content pre {
      background: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 6px;
      overflow: auto;
      margin: 1rem 0;
    }
    #readme-content pre code {
      background: none;
      padding: 0;
    }
    #readme-content blockquote {
      border-left: 3px solid #C5A059;
      padding-left: 1rem;
      color: #8E8E93;
      margin: 1rem 0;
    }
    #readme-content ul,
    #readme-content ol {
      padding-left: 1.5rem;
      margin: 1rem 0;
    }
    #readme-content li {
      margin-bottom: 0.5rem;
    }
    #readme-content a {
      color: #C5A059;
      text-decoration: underline;
    }
    #readme-content img {
      max-width: 100%;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Satyaa Goyal</h1>
      <p class="bio">Full‑Stack Developer – Building tools & utilities</p>
    </header>

    <main>
      <div class="grid" id="repo-grid"></div>
    </main>

    <div class="page-info" id="page-info"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Modal for README -->
  <div id="readme-modal" class="modal">
    <div class="modal-content">
      <span id="readme-close" class="close-btn">&times;</span>
      <div id="readme-content"></div>
    </div>
  </div>

  <script>
    const githubUser = 'CrimsonDevil333333';
    let repos = [];
    const itemsPerPage = 5;
    let currentPage = 0;

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function renderPage(page) {
      const grid = document.getElementById('repo-grid');
      grid.innerHTML = '';
      const start = page * itemsPerPage;
      const end = Math.min(start + itemsPerPage, repos.length);
      for (let i = start; i < end; i++) {
        const r = repos[i];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3 class="card-title"><a href="https://github.com/${githubUser}/${encodeURIComponent(r.name)}" target="_blank" rel="noopener noreferrer">${r.name}</a></h3>
          <p class="card-desc">${r.description || "No description provided."}</p>
          <div class="card-meta">
            ${r.language ? `<span class="badge">${r.language}</span>` : ''}
            <span><span class="material-icons" style="font-size:14px;vertical-align:middle">star</span> ${r.stars}</span>
            <span><span class="material-icons" style="font-size:14px;vertical-align:middle">call_split</span> ${r.forks}</span>
            <span><span class="material-icons" style="font-size:14px;vertical-align:middle">update</span> ${formatDate(r.pushed_at)}</span>
          </div>
          <button class="readme-btn" data-repo="${r.name}">View README</button>
        `;
        grid.appendChild(card);
      }

      const totalPages = Math.ceil(repos.length / itemsPerPage);
      document.getElementById('page-info').textContent = totalPages > 0 ? `${page + 1} of ${totalPages}` : '';

      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      for (let d = 0; d < totalPages; d++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (d === page ? ' active' : '');
        dot.addEventListener('click', () => {
          currentPage = d;
          renderPage(d);
        });
        pagination.appendChild(dot);
      }
    }

    async function loadRepos() {
      try {
        const res = await fetch(`https://api.github.com/users/${githubUser}/repos?type=owner&sort=pushed&direction=desc&per_page=100`);
        if (!res.ok) throw new Error('Failed to fetch repos');
        const data = await res.json();
        repos = data.map(r => ({
          name: r.name,
          description: r.description,
          language: r.language,
          stars: r.stargazers_count,
          forks: r.forks_count,
          pushed_at: r.pushed_at
        }));
        renderPage(0);
      } catch (err) {
        console.error(err);
        document.getElementById('repo-grid').innerHTML = '<p class="error">Unable to load repositories. Please try again later.</p>';
      }
    }

    // README modal functionality
    async function showReadme(repoName) {
      const modal = document.getElementById('readme-modal');
      const content = document.getElementById('readme-content');
      content.innerHTML = '<p style="color:#8E8E93">Loading README...</p>';
      modal.style.display = 'flex';
      try {
        const res = await fetch(`https://api.github.com/repos/${githubUser}/${encodeURIComponent(repoName)}/readme`);
        if (!res.ok) {
          if (res.status === 404) {
            content.innerHTML = '<p style="color:#8E8E93">No README found for this repository.</p>';
          } else {
            throw new Error(`Failed: ${res.status}`);
          }
          return;
        }
        const data = await res.json();
        let readmeHtml;
        if (data.encoding === 'base64') {
          const decoded = atob(data.content);
          readmeHtml = marked.parse(decoded);
        } else {
          readmeHtml = data.content;
        }
        content.innerHTML = readmeHtml;
      } catch (err) {
        console.error(err);
        content.innerHTML = '<p style="color:#ff6b6b">Error loading README. Please try again later.</p>';
      }
    }

    // Modal close handlers
    const modal = document.getElementById('readme-modal');
    const closeBtn = document.getElementById('readme-close');
    closeBtn.onclick = () => modal.style.display = 'none';
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.style.display = 'none'; });

    // Event delegation for readme buttons
    document.getElementById('repo-grid').addEventListener('click', (e) => {
      if (e.target.classList.contains('readme-btn')) {
        const repo = e.target.dataset.repo;
        if (repo) showReadme(repo);
      }
    });

    // Initial load
    loadRepos();
  </script>
</body>
</html>
